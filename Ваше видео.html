<!DOCTYPE html>

<html lang="ru"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ваше видео</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f4f4f5; background:
        radial-gradient(ellipse at 20% 0%, #24243a 0, transparent 45%),
        radial-gradient(ellipse at 100% 100%, #172b35 0, transparent 45%), #0b0c10;
    }
    .card {
      width: min(100%, 680px); overflow: hidden; border: 1px solid #ffffff18;
      border-radius: 24px; background: #ffffff08; box-shadow: 0 24px 80px #0006;
    }
    .cover {
      aspect-ratio: 16 / 9; display: grid; place-items: center; position: relative;
      background: linear-gradient(135deg, #222438, #172d35 60%, #101318);
    }
    .cover::after { content: ""; position: absolute; inset: 0;
      background: linear-gradient(0deg, #0005, transparent 60%); }
    .play {
      z-index: 1; width: 76px; height: 76px; display: grid; place-items: center;
      border-radius: 50%; background: #ffffff20; border: 1px solid #ffffff50;
      backdrop-filter: blur(10px); font-size: 28px; padding-left: 4px;
    }
    .content { padding: clamp(24px, 5vw, 42px); }
    .eyebrow { color: #a5b4fc; text-transform: uppercase; letter-spacing: .16em;
      font-size: 12px; font-weight: 700; }
    h1 { margin: 12px 0; font-size: clamp(26px, 5vw, 40px); line-height: 1.12; }
    p { color: #a1a1aa; line-height: 1.6; margin: 0 0 26px; }
    .button {
      display: flex; justify-content: center; align-items: center; gap: 10px;
      width: 100%; padding: 17px 20px; border-radius: 14px;
      color: #101014; background: #f4f4f5; text-decoration: none;
      font-weight: 700; transition: transform .2s, opacity .2s;
    }
    .button:hover { transform: translateY(-2px); opacity: .92; }
    .note { margin-top: 18px; font-size: 12px; text-align: center; color: #71717a; }
  </style>
</head>
<body>
  <main class="card">
    <div class="cover" aria-label="Обложка видео"><div class="play">▶</div></div>
    <section class="content">
      <div class="eyebrow">Видео для вас</div>
      <h1>Ваше видео</h1>
      <p>Готово к просмотру. Нажмите кнопку ниже, чтобы открыть видео.</p>
      <!-- Когда видео будет готово, замените VIDEO_URL на прямую ссылку на него -->
      <a class="button" href="file:///C:/Users/12600/Downloads/Telegram%20Desktop/VIDEO_URL" id="watch">▶ &nbsp; Смотреть видео</a>
      <div class="note">Ссылка на страницу постоянная · Видео появится здесь позже</div>
    </section>
  </main>
  <script>
    const link = document.getElementById('watch');
    if (link.href.endsWith('VIDEO_URL')) {
      link.addEventListener('click', e => {
        e.preventDefault();
        alert('Видео пока не загружено. Скоро оно появится здесь!');
      });
    }
  </script>


</body></html>
