<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ваше видео</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px;
      display: grid; place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f4f4f5; background:
        radial-gradient(ellipse at 15% 0%, #24243a 0, transparent 45%),
        radial-gradient(ellipse at 100% 100%, #172b35 0, transparent 45%), #0b0c10;
    }
    .page { width: min(100%, 1000px); }
    .heading { text-align: center; margin: 0 0 22px; }
    .eyebrow { color: #a5b4fc; text-transform: uppercase; letter-spacing: .16em;
      font-size: 12px; font-weight: 700; }
    h1 { margin: 10px 0 8px; font-size: clamp(26px, 5vw, 42px); }
    .subtitle { color: #a1a1aa; margin: 0; font-size: 15px; }
    .player {
      overflow: hidden; border: 1px solid #ffffff20; border-radius: 18px;
      background: #000; box-shadow: 0 24px 80px #0007;
    }
    .ratio { position: relative; width: 100%; aspect-ratio: 16 / 9; }
    iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .foot { text-align: center; margin-top: 18px; color: #71717a; font-size: 12px; }
    @media (max-width: 600px) {
      body { padding: 16px; }
      .player { border-radius: 12px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="heading">
      <div class="eyebrow">ТОХА</div>
      <h1>ЖИРНЫЙ ХУЙ</h1>
      <p class="subtitle">Приятного просмотра</p>
    </header>
    <div class="player">
      <div class="ratio">
        <iframe 
         src="<iframe src="https://vk.ru/video_ext.php?oid=-35002164&id=161714590&hash=d5de015a8fd30641&autoplay=1" width="426" height="240" allow="autoplay; encrypted-media; fullscreen; picture-in-picture; screen-wake-lock;" frameborder="0" allowfullscreen
        </iframe>
      </div>
    </div>
    <div class="foot"> </div>
  </main>
</body>
</html>
